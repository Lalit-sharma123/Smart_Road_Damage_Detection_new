version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: road_damage_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: road_damage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: road_damage_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: road_damage_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/road_damage_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkey_road_damage_detection_system_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - YOLO_MODEL_PATH=weights/yolov11x-pothole.pt
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./reports:/app/reports
      - ./weights:/app/weights
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: road_damage_celery
    command: celery -A app.services.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/road_damage_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./reports:/app/reports
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
